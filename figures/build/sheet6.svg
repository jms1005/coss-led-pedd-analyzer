<rect x="118.00" y="36.00" width="78.00" height="74.00" rx="1.50" fill="#f1f5f9" stroke="none" stroke-width="0.30"/>
<rect x="118.00" y="36.00" width="1.20" height="74.00" rx="0.00" fill="#2563eb" stroke="none" stroke-width="0.30"/>
<text x="122.00" y="41.60" font-size="3.80" text-anchor="start" font-weight="700" fill="#2563eb">이 그림이 말하는 것</text>
<text x="122.00" y="47.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">· 빛은 한 직선 위를 지납니다.</text>
<text x="122.00" y="51.60" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">  발광 → 큐벳 한가운데 → 검출</text>
<text x="122.00" y="55.80" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b"></text>
<text x="122.00" y="60.00" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">· 빨간 점선(광축)은 반드시</text>
<text x="122.00" y="64.20" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">  액체 속에 잠겨 있어야 합니다.</text>
<text x="122.00" y="68.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b"></text>
<text x="122.00" y="72.60" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">· 액면이 광축보다 10mm 넘게</text>
<text x="122.00" y="76.80" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">  위에 오도록 시료를 넣습니다.</text>
<text x="122.00" y="81.00" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b"></text>
<text x="122.00" y="85.20" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">· 40mm 는 처음 값입니다. 빛이</text>
<text x="122.00" y="89.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">  모자라면 LED 를 안으로 밀어</text>
<text x="122.00" y="93.60" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">  30mm 까지 좁힐 수 있습니다.</text>
<line x1="14.00" y1="126.00" x2="196.00" y2="126.00" stroke="#cbd5e1" stroke-width="0.30" stroke-linecap="butt"/>
<text x="14.00" y="136.00" font-size="4.40" text-anchor="start" font-weight="700" fill="#1e293b">빛이 새는지 검사하기</text>
<rect x="14.00" y="141.00" width="88.00" height="46.00" rx="1.50" fill="#f1f5f9" stroke="none" stroke-width="0.30"/>
<rect x="14.00" y="141.00" width="1.20" height="46.00" rx="0.00" fill="#059669" stroke="none" stroke-width="0.30"/>
<text x="18.00" y="146.60" font-size="3.80" text-anchor="start" font-weight="700" fill="#059669">1단계 — 눈으로</text>
<text x="18.00" y="152.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">불을 끈 방에서 뚜껑을 닫고,</text>
<text x="18.00" y="156.60" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">바깥에서 손전등을 여러 각도로 비춥니다.</text>
<text x="18.00" y="160.80" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">안쪽에서 새어 드는 빛이 보이면</text>
<text x="18.00" y="165.00" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">그 자리를 테이프로 막습니다.</text>
<text x="18.00" y="169.20" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b"></text>
<text x="18.00" y="173.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">이음새 → 배선 구멍 → 뚜껑 테두리</text>
<text x="18.00" y="177.60" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">순서로 잘 샙니다.</text>
<rect x="106.00" y="141.00" width="88.00" height="46.00" rx="1.50" fill="#f1f5f9" stroke="none" stroke-width="0.30"/>
<rect x="106.00" y="141.00" width="1.20" height="46.00" rx="0.00" fill="#059669" stroke="none" stroke-width="0.30"/>
<text x="110.00" y="146.60" font-size="3.80" text-anchor="start" font-weight="700" fill="#059669">2단계 — 펌웨어로 (더 확실함)</text>
<text x="110.00" y="152.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">부품이 오면 02_phase1 을 올리고,</text>
<text x="110.00" y="156.60" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">① 방 불 켜고 DARK 10회</text>
<text x="110.00" y="160.80" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">② 방 불 끄고 DARK 10회</text>
<text x="110.00" y="165.00" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">③ 두 평균을 비교</text>
<text x="110.00" y="169.20" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b"></text>
<text x="110.00" y="173.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">차이가 크면 빛이 새는 것입니다.</text>
<text x="110.00" y="177.60" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">이 수치는 PPT 에도 씁니다.</text>
<text x="14.00" y="197.00" font-size="4.40" text-anchor="start" font-weight="700" fill="#1e293b">완성 체크리스트</text>
<rect x="16.00" y="203.40" width="3.40" height="3.40" rx="0.40" fill="none" stroke="#1e293b" stroke-width="0.35"/>
<text x="21.40" y="206.00" font-size="3.10" text-anchor="start" font-weight="400" fill="#1e293b">불 끈 방에서 손전등을 비춰도 안쪽으로 빛이 새지 않는다</text>
<rect x="16.00" y="209.80" width="3.40" height="3.40" rx="0.40" fill="none" stroke="#1e293b" stroke-width="0.35"/>
<text x="21.40" y="212.40" font-size="3.10" text-anchor="start" font-weight="400" fill="#1e293b">큐벳(12.5 mm)이 지그 홈(13 × 13 mm)에 흔들림 없이 들어간다</text>
<rect x="16.00" y="216.20" width="3.40" height="3.40" rx="0.40" fill="none" stroke="#1e293b" stroke-width="0.35"/>
<text x="21.40" y="218.80" font-size="3.10" text-anchor="start" font-weight="400" fill="#1e293b">큐벳을 10번 넣었다 뺐다 해도 늘 같은 자리에 앉는다</text>
<rect x="16.00" y="222.60" width="3.40" height="3.40" rx="0.40" fill="none" stroke="#1e293b" stroke-width="0.35"/>
<text x="21.40" y="225.20" font-size="3.10" text-anchor="start" font-weight="400" fill="#1e293b">뚜껑을 여닫아도 LED 위치가 변하지 않는다</text>
<rect x="16.00" y="229.00" width="3.40" height="3.40" rx="0.40" fill="none" stroke="#1e293b" stroke-width="0.35"/>
<text x="21.40" y="231.60" font-size="3.10" text-anchor="start" font-weight="400" fill="#1e293b">빛이 큐벳의 맑은 구간 한가운데를 지난다</text>
<rect x="16.00" y="235.40" width="3.40" height="3.40" rx="0.40" fill="none" stroke="#1e293b" stroke-width="0.35"/>
<text x="21.40" y="238.00" font-size="3.10" text-anchor="start" font-weight="400" fill="#1e293b">광축이 액면보다 10mm 이상 아래에 있다</text>
<rect x="16.00" y="241.80" width="3.40" height="3.40" rx="0.40" fill="none" stroke="#1e293b" stroke-width="0.35"/>
<text x="21.40" y="244.40" font-size="3.10" text-anchor="start" font-weight="400" fill="#1e293b">큐벳의 광로 10mm 방향을 지그에 표시해 두었다</text>
<rect x="16.00" y="248.20" width="3.40" height="3.40" rx="0.40" fill="none" stroke="#1e293b" stroke-width="0.35"/>
<text x="21.40" y="250.80" font-size="3.10" text-anchor="start" font-weight="400" fill="#1e293b">발광–검출 거리를 실제로 재서 적어 두었다</text>
<rect x="16.00" y="254.60" width="3.40" height="3.40" rx="0.40" fill="none" stroke="#1e293b" stroke-width="0.35"/>
<text x="21.40" y="257.20" font-size="3.10" text-anchor="start" font-weight="400" fill="#1e293b">완성 사진을 찍었다 (PPT 3번 슬라이드·동영상 장면 2에 씁니다)</text>
<rect x="14.00" y="264.00" width="182.00" height="12.00" rx="1.50" fill="#f1f5f9" stroke="none" stroke-width="0.30"/>
<text x="18.00" y="271.50" font-size="3.40" text-anchor="start" font-weight="700" fill="#1e293b">발광–검출 거리: ______ mm</text>
<text x="82.00" y="271.50" font-size="3.40" text-anchor="start" font-weight="700" fill="#1e293b">광축 높이: ______ mm</text>
<text x="138.00" y="271.50" font-size="3.40" text-anchor="start" font-weight="700" fill="#1e293b">표준 주입량: ______ mL</text>
