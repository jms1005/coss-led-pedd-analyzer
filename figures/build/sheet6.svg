<text x="14.00" y="289.00" font-size="2.60" text-anchor="start" font-weight="400" fill="#64748b">차광 챔버 제작 도면  ·  LED PEDD 액체 광학 분석기</text>
<text x="196.00" y="289.00" font-size="2.60" text-anchor="end" font-weight="400" fill="#64748b">완성 후 확인</text>
