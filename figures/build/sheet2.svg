<text x="119.00" y="123.60" font-size="3.80" text-anchor="start" font-weight="700" fill="#059669">③ 마개가 필요한 이유</text>
<text x="119.00" y="129.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">뚜껑을 그냥 얹으면 테두리 틈으로</text>
<text x="119.00" y="133.80" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">빛이 들어옵니다. 마개가 상자 안으로</text>
<text x="119.00" y="138.20" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">쏙 들어가 빛이 꺾이지 않으면</text>
<text x="119.00" y="142.60" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">안까지 못 들어옵니다.</text>
<text x="119.00" y="147.00" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b"></text>
<text x="119.00" y="151.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">뚜껑 한가운데에 맞춰 붙이세요.</text>
<rect x="14.00" y="176.00" width="182.00" height="52.00" rx="1.50" fill="#f1f5f9" stroke="none" stroke-width="0.30"/>
<rect x="14.00" y="176.00" width="1.20" height="52.00" rx="0.00" fill="#2563eb" stroke="none" stroke-width="0.30"/>
<text x="18.00" y="181.60" font-size="3.80" text-anchor="start" font-weight="700" fill="#2563eb">자르는 방법</text>
<text x="18.00" y="187.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">1.  이 종이를 가위로 오립니다. 검은 실선 바로 바깥을 오리면 됩니다.</text>
<text x="18.00" y="191.80" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">2.  우드락 위에 올리고 마스킹테이프로 살짝 고정합니다.</text>
<text x="18.00" y="196.20" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">3.  네 모서리의 빨간 십자 표시를 연필로 콕콕 찍어 우드락에 옮깁니다.</text>
<text x="18.00" y="200.60" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">4.  종이를 떼고, 찍은 점 4개를 자로 이어 선을 긋습니다.</text>
<text x="18.00" y="205.00" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">5.  금속 자를 대고 커터로 자릅니다. 한 번에 깊게 긋지 말고</text>
<text x="18.00" y="209.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">     같은 자리를 3~4번 살살 그어야 단면이 깨끗합니다.</text>
<text x="18.00" y="213.80" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b"></text>
<text x="18.00" y="218.20" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">※ 커터 날은 새것을 쓰세요. 무딘 날은 우드락을 찢습니다.</text>
<text x="18.00" y="222.60" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">※ 자를 때는 반드시 아래에 두꺼운 종이나 책받침을 깝니다.</text>
<rect x="14.00" y="236.00" width="182.00" height="25.20" rx="1.50" fill="#fef2f2" stroke="#dc2626" stroke-width="0.40"/>
<text x="18.00" y="242.20" font-size="3.80" text-anchor="start" font-weight="700" fill="#dc2626">손을 다치지 않게</text>
<text x="18.00" y="248.00" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">커터는 자를 잡은 손의 반대 방향으로만 밉니다.</text>
<text x="18.00" y="252.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">자를 잡은 손가락은 자의 위쪽에 두고, 날이 지나가는 선 옆에 두지 않습니다.</text>
<text x="18.00" y="256.80" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">어른과 함께 하세요.</text>
<line x1="14.00" y1="285.00" x2="196.00" y2="285.00" stroke="#cbd5e1" stroke-width="0.30" stroke-linecap="butt"/>
<text x="14.00" y="289.00" font-size="2.60" text-anchor="start" font-weight="400" fill="#64748b">차광 챔버 제작 도면  ·  LED PEDD 액체 광학 분석기</text>
<text x="196.00" y="289.00" font-size="2.60" text-anchor="end" font-weight="400" fill="#64748b">1:1 실척 · 인쇄 배율 100%</text>
