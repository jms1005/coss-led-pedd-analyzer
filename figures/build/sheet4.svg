<text x="96.00" y="175.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">큐벳 속 시료가 지나는 통로가 좁으면(4mm쯤), 5mm LED 의 빛이</text>
<text x="96.00" y="179.60" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">통로보다 넓어서 일부가 시료를 안 지나고 옆으로 새어 갑니다.</text>
<text x="96.00" y="183.80" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">그 빛은 시료 정보가 없어서 측정을 방해합니다.</text>
<text x="96.00" y="188.00" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b"></text>
<text x="96.00" y="192.20" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">그래서 발광 LED 앞에 이 마스크를 붙여 빛을 좁혀 줍니다.</text>
<text x="96.00" y="196.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b"></text>
<text x="96.00" y="200.60" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">단, 빛이 약해지는 대가가 있으니 처음부터 붙이지 말고</text>
<text x="96.00" y="204.80" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">시료끼리 값 차이가 잘 안 날 때만 붙이세요.</text>
<rect x="14.00" y="230.00" width="182.00" height="25.20" rx="1.50" fill="#fef2f2" stroke="#dc2626" stroke-width="0.40"/>
<text x="18.00" y="236.20" font-size="3.80" text-anchor="start" font-weight="700" fill="#dc2626">작은 조각 자를 때</text>
<text x="18.00" y="242.00" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">⑨ 짧은 조각은 13 × 8 mm 로 아주 작습니다. 큰 우드락에서 먼저 8mm 폭의</text>
<text x="18.00" y="246.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">긴 띠를 하나 자른 다음, 그 띠를 13mm 씩 토막 내면 훨씬 쉽고 정확합니다.</text>
<text x="18.00" y="250.80" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">손가락을 날 앞에 두지 말고, 조각이 작을수록 핀셋을 쓰세요.</text>
<rect x="14.00" y="268.00" width="182.00" height="16.00" rx="1.50" fill="#f1f5f9" stroke="none" stroke-width="0.30"/>
<rect x="14.00" y="268.00" width="1.20" height="16.00" rx="0.00" fill="#2563eb" stroke="none" stroke-width="0.30"/>
<text x="18.00" y="273.60" font-size="3.80" text-anchor="start" font-weight="700" fill="#2563eb">재료 확인</text>
<text x="18.00" y="279.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">⑧⑨ 지그 = 우드락 5mm   ·   ⑩ 슬릿 마스크 = 검정 무광 도화지 (반짝이는 종이는 빛을 반사해서 안 됩니다)</text>
