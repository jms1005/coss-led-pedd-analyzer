<!doctype html>
<meta charset="utf-8">
<title>브레드보드 배선도</title>
<!--
  배선도 4장을 A4 PDF 로 묶는 인쇄 래퍼.

  제작 도면(figures/build)과 달리 이 장들은 1:1 실척이 아니다. 구멍 번호를
  보고 꽂는 지도이므로 배율이 조금 달라져도 상관없다. 다만 글자가 작으므로
  축소 인쇄는 피하는 편이 좋다.
-->
<style>
  @page { size: A4; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  .page {
    width: 210mm;
    height: 297mm;
    overflow: hidden;
    display: block;
    page-break-after: always;
    break-after: page;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }
  .page img { display: block; width: 210mm; height: 297mm; }

  .hint {
    font: 14px/1.6 'Malgun Gothic', sans-serif;
    max-width: 210mm;
    margin: 16px auto;
    padding: 14px 18px;
    background: #eff6ff;
    border: 1px solid #2563eb;
    border-radius: 6px;
    color: #1e293b;
  }
  .hint b { color: #2563eb; }
  @media print { .hint { display: none; } }
</style>

<div class="hint">
  <b>이 4장은 실제 크기가 아닙니다.</b>
  대고 자르는 템플릿이 아니라 어느 구멍에 꽂는지 보는 지도입니다.<br>
  A4 로 인쇄하되 배율은 신경 쓰지 않아도 됩니다. 다만 글자가 작으니
  축소는 하지 마세요.<br>
  <b>4장(확인표)은 손으로 체크하며 쓰는 장</b>이라 꼭 인쇄하시길 권합니다.
</div>

<div class="page"><img src="wire1.svg" alt="1장 한눈에 보기"></div>
<div class="page"><img src="wire2.svg" alt="2장 브레드보드 배치도"></div>
<div class="page"><img src="wire3.svg" alt="3장 연결 순서"></div>
<div class="page"><img src="wire4.svg" alt="4장 연결 확인표"></div>
