<text x="169.00" y="200.60" font-size="3.00" text-anchor="start" font-weight="400" fill="#64748b">검정</text>
<text x="14.00" y="208.60" font-size="4.40" text-anchor="start" font-weight="700" fill="#1e293b">LED 다리 구별하는 법</text>
<rect x="14.00" y="213.60" width="96.00" height="40.00" rx="1.50" fill="#f1f5f9" stroke="none" stroke-width="0.30"/>
<rect x="14.00" y="213.60" width="1.20" height="40.00" rx="0.00" fill="#059669" stroke="none" stroke-width="0.30"/>
<text x="18.00" y="219.20" font-size="3.80" text-anchor="start" font-weight="700" fill="#059669">긴 다리 = + , 짧은 다리 = −</text>
<text x="18.00" y="225.00" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">LED 를 옆에서 보면 다리 길이가 다릅니다.</text>
<text x="18.00" y="229.20" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">짧은 다리 쪽 렌즈 테두리가 평평하게</text>
<text x="18.00" y="233.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">깎여 있기도 합니다.</text>
<text x="18.00" y="237.60" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b"></text>
<text x="18.00" y="241.80" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">· 긴 다리(+, 애노드) → 저항 쪽</text>
<text x="18.00" y="246.00" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">· 짧은 다리(−, 캐소드) → GND 쪽</text>
<rect x="109.00" y="213.60" width="87.00" height="38.40" rx="1.50" fill="#fef2f2" stroke="#dc2626" stroke-width="0.40"/>
<text x="113.00" y="219.80" font-size="3.80" text-anchor="start" font-weight="700" fill="#dc2626">검출 LED 하나만 반대입니다</text>
<text x="113.00" y="225.60" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">발광 LED 3개는 짧은 다리가 GND 로 갑니다. 보통 방식입니다.</text>
<text x="113.00" y="230.00" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b"></text>
<text x="113.00" y="234.40" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">검출 LED(D4)만 <tspan font-weight="700">짧은 다리가 우노 D7 로</tspan>, 긴 다리가 GND 로</text>
<text x="113.00" y="238.80" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">갑니다. 거꾸로 꽂아야 빛을 받아 전기를 만드는 소자가 됩니다.</text>
<text x="113.00" y="243.20" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b"></text>
<text x="113.00" y="247.60" font-size="3.20" text-anchor="start" font-weight="400" fill="#1e293b">이걸 바로 꽂으면 측정이 전부 TIMEOUT 으로 나옵니다.</text>
