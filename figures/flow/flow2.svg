<text x="59.0" y="679.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1e293b">전기가 1.1V 아래로 내려가는 순간을 칩 안의 비교기가 알아채고 스톱워치를 멈춘다.</text>
<text x="59.0" y="696.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1e293b">빛이 밝으면 시간이 짧고 어두우면 길다. 그래서 이 시간 하나로 밝기를 숫자로 바꿀 수 있다.</text>
<text x="59.0" y="713.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1e293b">액체가 빛을 많이 삼킬수록 검출 LED 에 닿는 빛이 줄고, 시간은 길어진다.</text>
