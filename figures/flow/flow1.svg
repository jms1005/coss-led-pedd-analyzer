<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="580" viewBox="0 0 1020 580" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif">
<rect width="1020" height="580" fill="#ffffff"/>
<text x="40.0" y="42.0" font-size="21.0" text-anchor="start" font-weight="700" fill="#1e293b">전기는 어디서 시작해 어디로 가나 — 빛을 내는 LED</text>
<text x="40.0" y="66.0" font-size="13.0" text-anchor="start" font-weight="400" fill="#64748b">전기는 반드시 한 바퀴를 돌아야 흐른다. 출발점은 USB, 도착점도 USB 다.</text>
<rect x="40.0" y="130.0" width="112.0" height="86.0" rx="8.0" fill="#ffffff" stroke="#ea580c" stroke-width="2.0"/>
<text x="96.0" y="165.0" font-size="13.5" text-anchor="middle" font-weight="700" fill="#ea580c">USB 케이블</text>
<text x="96.0" y="190.0" font-size="19.0" text-anchor="middle" font-weight="700" fill="#ea580c">5V</text>
<circle cx="40.0" cy="130.0" r="13.0" fill="#ea580c" stroke="#ffffff" stroke-width="2.0"/>
<text x="40.0" y="135.0" font-size="14.0" text-anchor="middle" font-weight="700" fill="#ffffff">1</text>
<line x1="152.0" y1="173.0" x2="196.0" y2="173.0" stroke="#ea580c" stroke-width="3.4" stroke-linecap="round"/>
<polygon points="174.0,173.0 167.0,169.2 167.0,176.8" fill="#ea580c" stroke="#ea580c" stroke-width="0.5" stroke-linejoin="round"/>
<rect x="196.0" y="110.0" width="218.0" height="218.0" rx="10.0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="212.0" y="136.0" font-size="14.0" text-anchor="start" font-weight="700" fill="#1e293b">아두이노 우노 보드</text>
<rect x="228.0" y="158.0" width="154.0" height="78.0" rx="6.0" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
<text x="305.0" y="190.0" font-size="14.0" text-anchor="middle" font-weight="700" fill="#1e293b">ATmega328P</text>
<text x="305.0" y="210.0" font-size="12.0" text-anchor="middle" font-weight="400" fill="#64748b">두뇌 칩</text>
<text x="305.0" y="228.0" font-size="11.0" text-anchor="middle" font-weight="400" fill="#64748b">여기가 핀을 켜고 끈다</text>
<rect x="382.0" y="256.0" width="64.0" height="36.0" rx="6.0" fill="#ffffff" stroke="#dc2626" stroke-width="2.0"/>
<text x="414.0" y="272.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#dc2626">D8</text>
<text x="414.0" y="289.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#64748b">나가는 문</text>
<rect x="382.0" y="382.0" width="64.0" height="36.0" rx="6.0" fill="#ffffff" stroke="#0f172a" stroke-width="2.0"/>
<text x="414.0" y="398.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#0f172a">GND</text>
<text x="414.0" y="415.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#64748b">돌아오는 문</text>
<circle cx="468.0" cy="274.0" r="13.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.0"/>
<text x="468.0" y="279.0" font-size="14.0" text-anchor="middle" font-weight="700" fill="#ffffff">2</text>
<line x1="446.0" y1="274.0" x2="516.0" y2="274.0" stroke="#dc2626" stroke-width="3.4" stroke-linecap="round"/>
<polygon points="481.0,274.0 474.0,270.1 474.0,277.9" fill="#dc2626" stroke="#dc2626" stroke-width="0.5" stroke-linejoin="round"/>
<path d="M 516.0 274.0 L 521.7 283.0 L 533.0 265.0 L 544.3 283.0 L 555.7 265.0 L 567.0 283.0 L 578.3 265.0 L 584.0 274.0" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="550.0" y="258.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#dc2626">220Ω 저항</text>
<circle cx="550.0" cy="232.0" r="13.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.0"/>
<text x="550.0" y="237.0" font-size="14.0" text-anchor="middle" font-weight="700" fill="#ffffff">3</text>
<line x1="584.0" y1="274.0" x2="650.0" y2="274.0" stroke="#dc2626" stroke-width="3.4" stroke-linecap="round"/>
<polygon points="617.0,274.0 610.0,270.1 610.0,277.9" fill="#dc2626" stroke="#dc2626" stroke-width="0.5" stroke-linejoin="round"/>
<polygon points="650.0,259.1 650.0,288.9 672.8,274.0" fill="#dc2626" stroke="#dc2626" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="672.8" y1="256.7" x2="672.8" y2="291.3" stroke="#dc2626" stroke-width="3.4" stroke-linecap="round"/>
<line x1="670.1" y1="250.4" x2="676.0" y2="242.8" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round"/>
<line x1="674.0" y1="255.2" x2="682.7" y2="251.2" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round"/>
<line x1="675.2" y1="261.3" x2="684.8" y2="261.6" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="706.0" cy="226.0" r="13.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.0"/>
<text x="706.0" y="231.0" font-size="14.0" text-anchor="middle" font-weight="700" fill="#ffffff">4</text>
<text x="646.0" y="318.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#64748b">긴 다리</text>
<text x="686.0" y="318.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#64748b">→</text>
<text x="722.0" y="318.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#64748b">짧은 다리</text>
<text x="672.0" y="208.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#dc2626">빨간 LED</text>
<line x1="672.8" y1="274.0" x2="790.0" y2="274.0" stroke="#dc2626" stroke-width="3.4" stroke-linecap="round"/>
<polygon points="731.4,274.0 724.4,270.1 724.4,277.9" fill="#dc2626" stroke="#dc2626" stroke-width="0.5" stroke-linejoin="round"/>
<line x1="790.0" y1="274.0" x2="790.0" y2="400.0" stroke="#dc2626" stroke-width="3.4" stroke-linecap="round"/>
<polygon points="790.0,337.0 793.9,330.0 786.1,330.0" fill="#dc2626" stroke="#dc2626" stroke-width="0.5" stroke-linejoin="round"/>
<line x1="446.0" y1="400.0" x2="790.0" y2="400.0" stroke="#0f172a" stroke-width="4.0" stroke-linecap="round"/>
<text x="800.0" y="405.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#0f172a">GND (− 줄)</text>
<line x1="700.0" y1="400.0" x2="470.0" y2="400.0" stroke="#0f172a" stroke-width="3.4" stroke-linecap="round"/>
<polygon points="585.0,400.0 592.0,403.9 592.0,396.1" fill="#0f172a" stroke="#0f172a" stroke-width="0.5" stroke-linejoin="round"/>
<circle cx="600.0" cy="400.0" r="13.0" fill="#0f172a" stroke="#ffffff" stroke-width="2.0"/>
<text x="600.0" y="405.0" font-size="14.0" text-anchor="middle" font-weight="700" fill="#ffffff">5</text>
<text x="852.0" y="248.0" font-size="12.0" text-anchor="start" font-weight="400" fill="#64748b">초록 LED 는 D9,</text>
<text x="852.0" y="266.0" font-size="12.0" text-anchor="start" font-weight="400" fill="#64748b">파랑 LED 는 D10 으로</text>
<text x="852.0" y="284.0" font-size="12.0" text-anchor="start" font-weight="400" fill="#64748b">똑같은 길이 하나씩</text>
<text x="852.0" y="302.0" font-size="12.0" text-anchor="start" font-weight="400" fill="#64748b">더 있다.</text>
<rect x="40.0" y="434.0" width="940.0" height="124.0" rx="8.0" fill="#f1f5f9" stroke="none" stroke-width="0.0"/>
<line x1="40.0" y1="438.0" x2="40.0" y2="554.0" stroke="#dc2626" stroke-width="3.0" stroke-linecap="round"/>
<text x="59.0" y="458.0" font-size="13.0" text-anchor="start" font-weight="700" fill="#dc2626">전기가 지나가는 순서</text>
<text x="59.0" y="475.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1e293b">① USB 케이블을 통해 5V 전기가 보드로 들어온다. 모든 전기의 출발점이다.</text>
<text x="59.0" y="492.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1e293b">② 두뇌 칩이 D8 핀을 5V 로 올린다. 수도꼭지를 여는 것과 같다. 끄면 0V 가 되어 물이 멈춘다.</text>
<text x="59.0" y="509.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1e293b">③ 220Ω 저항이 전기의 양을 줄인다. 이게 없으면 LED 에 전기가 너무 많이 흘러 타 버린다.</text>
<text x="59.0" y="526.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1e293b">④ LED 의 긴 다리로 들어가 짧은 다리로 나오면서 빛이 난다. 반대로 꽂으면 아예 흐르지 않는다.</text>
<text x="59.0" y="543.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1e293b">⑤ GND(− 줄)를 타고 보드로 돌아간다. 여기까지 와야 한 바퀴가 완성된다.</text>
</svg>
